<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f4c95">
<meta name="color-scheme" content="light">
<title>BMW diagnostics</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
  /*
   * A light theme, committed to rather than switched: this is read in daylight, in a car, on a
   * phone propped against the wheel. There is no dark variant on purpose - an automatic one was
   * here before and made the page look like a template rather than an instrument.
   */
  :root {
    --blue-900: #0a2d5e;
    --blue-800: #0f3f7d;
    --blue-700: #14529d;
    --blue-600: #1a66bd;
    --blue-500: #2a80dd;
    --blue-200: #b6d4f4;
    --blue-100: #dceaf9;
    --blue-050: #f0f6fd;

    --ink:   #0d1b2a;
    --dim:   #566475;
    --faint: #8b97a6;
    --rule:  #d8e2ee;
    --paper: #fff;

    --ok:    #3f7a56;
    --amber: #9a5400;
    --amber-bright: #e8a33c;
    --amber-edge: #eedcbd;
    --red:   #a81e12;

    /* The tile tint and its edge, kept as one knob so the whole grid can be warmed or cooled. */
    --tile-tint: #e4eef9;
    --tile-warm: #faeedb;
    --tile-edge: #dbe6f2;

    --r: 14px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    color: var(--ink);
    background:
      radial-gradient(1100px 520px at 12% -12%, #e3eefb 0%, rgba(227,238,251,0) 70%),
      linear-gradient(#f7fafd, #eef3f9);
    background-attachment: fixed;
    min-height: 100vh;
    font: 15px/1.55 ui-sans-serif, "Segoe UI Variable Text", "Segoe UI", Roboto, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: max(14px, env(safe-area-inset-top)) 14px max(20px, env(safe-area-inset-bottom));
    max-width: 780px;
    margin-inline: auto;
  }

  /* ---------------------------------------------------------------- header */

  header { margin-bottom: 16px; }
  .titlebar { display: flex; align-items: center; gap: 12px; }
  h1 {
    font-size: 1.22rem; font-weight: 700; letter-spacing: -.02em; margin: 0;
    color: var(--blue-900); flex: 1;
  }
  .sub { color: var(--dim); font-size: .84rem; }

  #lang {
    font: inherit; font-size: .82rem; font-weight: 600; color: var(--blue-700);
    background: var(--paper); border: 1px solid var(--blue-200); border-radius: 9px;
    padding: 5px 8px; cursor: pointer;
  }

  /*
   * The vitals come off the car, not out of the markup. The cluster is asked for its odometer and
   * its stored VIN during the scan; before that there is nothing to show and nothing is shown.
   */
  .vitals {
    display: flex; flex-wrap: wrap; gap: 0 26px; margin-top: 10px;
    padding: 11px 14px; border-radius: var(--r);
    background: var(--paper); border: 1px solid var(--rule);
    box-shadow: 0 1px 2px rgba(13, 27, 42, .04);
  }
  .vitals:empty { display: none; }
  .vital dt {
    font-size: .64rem; font-weight: 700; letter-spacing: .09em; text-transform: uppercase;
    color: var(--faint); margin: 0;
  }
  .vital dd {
    margin: 1px 0 0; font-size: .98rem; font-weight: 650;
    font-variant-numeric: tabular-nums; letter-spacing: -.01em; color: var(--blue-800);
  }

  /* ---------------------------------------------------------------- controls */

  button {
    font: inherit; font-weight: 600; letter-spacing: -.005em;
    border: 0; border-radius: 10px; padding: 10px 16px; cursor: pointer;
    color: #fff; background: var(--blue-700);
  }
  /*
   * `:not(.tile)` is load-bearing. A tile is a <button>, so without it the generic hover painted
   * every tile dark blue under its dark text and made the whole card unreadable on a desktop.
   */
  button:not(.tile):hover { background: var(--blue-800); }
  button.ghost:not(.tile):hover { background: var(--blue-050); }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: .45; cursor: default; transform: none; }
  button.ghost {
    background: var(--paper); color: var(--blue-700);
    border: 1px solid var(--blue-200); box-shadow: none; font-weight: 600;
  }
  button:focus-visible { outline: 2px solid var(--blue-500); outline-offset: 2px; }

  .bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
  /* The export bar follows the grid directly and `.bar` only has a bottom margin, so without this
     the buttons sit against the last row of tiles. 20px clears the grid's own 12px gap. */
  #exports { margin-top: 20px; }
  .status { color: var(--dim); font-size: .84rem; }

  /* ---------------------------------------------------------------- tiles */

  /*
   * Pale rather than saturated, and matte rather than glossy.
   *
   * The first version filled each tile with strong blue under a radial white highlight, which is
   * the Web 2.0 button idiom and dates the page on sight. The blue is still here and still a
   * gradient, but it is a tint the dark text sits on top of; the colour that carries meaning is
   * the small amber accent on a module with faults, not the field behind it.
   */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }

  .tile {
    position: relative; overflow: hidden;
    border: 1px solid var(--tile-edge); border-radius: 16px; padding: 15px;
    min-height: 128px; text-align: left; font: inherit; font-weight: 400;
    display: flex; flex-direction: column; gap: 2px;
    color: var(--blue-900);
    background: linear-gradient(158deg, #fbfdff 0%, var(--tile-tint) 100%);
    box-shadow: 0 1px 2px rgba(16, 48, 88, .05);
    cursor: default; transition: border-color .14s ease, box-shadow .14s ease, transform .14s ease;
  }
  .tile.clickable { cursor: pointer; }
  .tile.clickable:hover {
    transform: translateY(-1px); border-color: var(--blue-300);
    box-shadow: 0 2px 10px -2px rgba(16, 48, 88, .14);
  }

  .tile .ic {
    width: 26px; height: 26px; color: var(--blue-600);
    stroke: currentColor; fill: none; stroke-width: 1.55;
    stroke-linecap: round; stroke-linejoin: round;
  }
  .tile .name { font-weight: 700; font-size: 1.02rem; letter-spacing: -.015em; margin-top: 9px; }
  .tile .label { color: var(--dim); font-size: .78rem; line-height: 1.35; }
  .tile .state {
    margin-top: auto; padding-top: 9px; font-size: .74rem; font-weight: 700;
    letter-spacing: .035em; text-transform: uppercase; color: var(--ok);
  }

  /*
   * A module with faults keeps the blue tile.
   *
   * An earlier version turned it amber, and with five of nine modules holding faults the grid came
   * out more amber than blue - the alarm colour became the background. The fault now shows as a
   * bar down the edge, an amber pictogram and an amber count, which is enough to find across a
   * grid without the page shouting.
   */
  .tile.warn .ic { color: var(--amber); }
  .tile.warn .state { color: var(--amber); }
  .tile.warn::after {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
    background: var(--amber-bright);
  }

  /* Absent modules are not a result, they are an absence. */
  .tile.off { background: none; border-style: dashed; box-shadow: none; }
  .tile.off .ic { color: var(--faint); }
  .tile.off .name { color: var(--dim); }
  .tile.off .label, .tile.off .state { color: var(--faint); text-transform: none; letter-spacing: 0; font-weight: 500; }

  .tile.busy .state { color: var(--faint); }
  .tile.busy { animation: breathe 1.5s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: .62; } }

  /*
   * The hunt for modules this software does not know sits in the grid as an empty slot.
   *
   * It was a button inside a collapsed `<details>` and nobody would have found it. As the last
   * tile - dashed, like an absent module, because that is what it is looking for - it reads as
   * part of the same list and invites the press.
   */
  .tile.hunt {
    background: none; border-style: dashed; border-color: var(--blue-200); box-shadow: none;
    color: var(--blue-700); cursor: pointer;
  }
  .tile.hunt .ic { color: var(--blue-500); }
  .tile.hunt .label { color: var(--dim); }
  .tile.hunt .state { color: var(--faint); text-transform: none; letter-spacing: 0; font-weight: 500; }
  .tile.hunt:hover { border-color: var(--blue-500); background: var(--blue-050); }
  .tile.hunt:disabled { opacity: .45; cursor: default; }
  .tile.hunt:disabled:hover { border-color: var(--blue-200); background: none; }

  /* ---------------------------------------------------------------- dialog */

  dialog {
    border: 0; border-radius: 16px; background: var(--paper); color: var(--ink);
    max-width: 580px; width: calc(100% - 26px); padding: 0;
    box-shadow: 0 24px 60px -14px rgba(10, 45, 94, .5);
  }
  dialog::backdrop { background: rgba(16, 48, 88, .34); backdrop-filter: blur(2px); }

  /* The consent dialog. Deliberately plainer than the rest - this is a thing to read, not a
     thing to admire, and an amber lead is the only colour in it. */
  .warn-lead { background: var(--tile-warm); border-left: 3px solid var(--amber-bright);
               padding: 10px 12px; margin: 0 0 14px; border-radius: 0 6px 6px 0; }
  .consent-list { margin: 0 0 16px; padding-left: 20px; }
  .consent-list li { padding: 3px 0; }
  .consent-list li.sensitive { color: var(--amber); font-weight: 600; }
  .consent-opt { display: flex; gap: 10px; align-items: flex-start; padding: 12px;
                 border: 1px solid var(--rule); border-radius: 8px; cursor: pointer; }
  .consent-opt input { margin-top: 3px; flex: none; width: 18px; height: 18px; }

  /* ---------------------------------------------------------------- footer */
  .foot { margin: 34px 0 8px; padding-top: 16px; border-top: 1px solid var(--rule); }
  .foot-warn { background: var(--tile-warm); border-left: 3px solid var(--amber-bright);
               padding: 10px 12px; margin: 0 0 14px; border-radius: 0 6px 6px 0;
               font-size: .88rem; color: var(--ink); }
  .foot-links { margin: 0 0 8px; font-size: .88rem; color: var(--faint); }
  .foot-links a { color: var(--blue-700); text-decoration: none; font-weight: 500; }
  .foot-links a:hover { text-decoration: underline; }
  .foot-note { margin: 0; font-size: .8rem; color: var(--faint); }
  .dlg-head {
    padding: 16px 18px; display: flex; gap: 13px; align-items: center;
    color: var(--blue-900); border-bottom: 1px solid var(--rule);
    background: linear-gradient(158deg, #fbfdff, var(--tile-tint));
  }
  .dlg-head .ic {
    width: 29px; height: 29px; flex: none; color: var(--blue-600);
    stroke: currentColor; fill: none; stroke-width: 1.55;
    stroke-linecap: round; stroke-linejoin: round;
  }
  .dlg-head b { font-size: 1.04rem; letter-spacing: -.01em; }
  .dlg-body { padding: 16px 18px; }

  /* Panels: the unknown-module results, and the unlock explainer. */
  .panel {
    margin-top: 18px; padding: 15px 17px; border-radius: 16px;
    background: var(--paper); border: 1px solid var(--rule);
  }
  .livevalue {
    font-size: 2.6rem; font-weight: 700; letter-spacing: -.03em;
    font-variant-numeric: tabular-nums; color: var(--blue-800); line-height: 1.1;
  }
  .panel h2 { font-size: .95rem; margin: 0 0 10px; letter-spacing: -.01em; color: var(--blue-900); }
  .panel-body { padding: 2px 0 6px; }
  .unlock {
    margin-top: 16px; padding: 13px 15px; border-radius: 12px;
    background: var(--blue-050); border: 1px solid var(--blue-200); font-size: .85rem;
  }
  .unlock p { margin: 0 0 9px; }
  .unlock code {
    font-family: ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
    font-size: .92em; background: #fff; padding: 1px 4px; border-radius: 4px;
    border: 1px solid var(--blue-200);
  }

  .store {
    font-weight: 700; font-size: .7rem; letter-spacing: .07em; text-transform: uppercase;
    color: var(--faint); margin: 17px 0 9px;
  }
  .store:first-child { margin-top: 0; }

  .fault {
    border-left: 3px solid var(--amber); border-radius: 0 9px 9px 0;
    background: linear-gradient(90deg, #fdf5e9, rgba(253,245,233,0));
    padding: 8px 10px 8px 11px; margin-bottom: 9px;
  }
  .fault code {
    font-size: 1.02rem; font-weight: 700; color: var(--amber);
    font-family: ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
  }
  .fault .desc { font-size: .92rem; margin-top: 1px; }
  .fault .raw {
    color: var(--faint); font-size: .72rem; margin-top: 3px; word-break: break-all;
    font-family: ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
  }
  .meta {
    color: var(--faint); font-size: .72rem; word-break: break-all; margin: 5px 0 0;
    font-family: ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
  }
  .dlg-foot {
    padding: 12px 17px; border-top: 1px solid var(--rule);
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
  }
  .dlg-foot .status { flex: 1 1 100%; order: 3; }
  .dlg-foot #d-close { margin-left: auto; }

  /* ---------------------------------------------------------------- the rest */

  details { margin-top: 20px; }
  summary {
    cursor: pointer; color: var(--blue-700); font-size: .84rem; font-weight: 600;
    padding: 7px 0;
  }
  pre#trace {
    background: #0c2746; color: #cfe2f7; border-radius: 11px;
    padding: 12px; overflow-x: auto; font-size: .71rem; line-height: 1.5;
    font-family: ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
    max-height: 44vh; margin: 2px 0 0;
  }
  .note { color: var(--dim); font-size: .81rem; margin-top: 15px; }
  .warnbox {
    border: 1px solid #f0d49a; background: #fdf7ea; border-left: 3px solid var(--amber);
    border-radius: 11px; padding: 11px 13px; margin-bottom: 15px; font-size: .85rem;
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<!--
  The pictograms, in one place.

  Each module in `protocol.js` names a symbol id here; nothing else in the code knows what a module
  looks like. To change a pictogram, replace the paths inside its `<symbol>` and leave everything
  else alone. They are stroked line art on a 24x24 grid using `currentColor`, which is what lets the
  same icon sit on a blue tile and on a white one.
-->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="ic-zke" viewBox="0 0 24 24">
    <path d="M3.2 19.3v-8.7L7.5 4.7h13.3v14.6z"/>
    <path d="M6.7 10.6h7.7V5.1"/>
    <path d="M5.9 15.3h4.3"/>
    <circle cx="17.2" cy="13.4" r="1"/>
  </symbol>
  <symbol id="ic-dme" viewBox="0 0 24 24">
    <path d="M3 15.5v-4h1.8V9.3h3V7.5h4.4v1.8h2l3.3-2.2v10.3l-3.3-2.2h-2v1.8H7.8v-1.5z"/>
    <path d="M9 7.5V4.8h3.2"/>
  </symbol>
  <symbol id="ic-abs" viewBox="0 0 24 24">
    <circle cx="10.5" cy="12" r="7.6"/>
    <circle cx="10.5" cy="12" r="2.7"/>
    <path d="M17.6 8.6h2.3a1.2 1.2 0 0 1 1.2 1.2v4.4a1.2 1.2 0 0 1-1.2 1.2h-2.3"/>
  </symbol>
  <symbol id="ic-ews" viewBox="0 0 24 24">
    <circle cx="8.2" cy="8.2" r="3.4"/>
    <path d="M10.6 10.6 19.6 19.6"/>
    <path d="M14.4 14.4l2.1-2.1"/>
    <path d="M16.8 16.8l2.1-2.1"/>
  </symbol>
  <symbol id="ic-lew" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="8.8"/>
    <circle cx="12" cy="12" r="2.6"/>
    <path d="M12 9.4V3.2"/>
    <path d="M9.7 13.3 4.3 16.5"/>
    <path d="M14.3 13.3l5.4 3.2"/>
  </symbol>
  <symbol id="ic-ihka" viewBox="0 0 24 24">
    <path d="M12 3v18"/>
    <path d="M4.2 7.5l15.6 9"/>
    <path d="M19.8 7.5l-15.6 9"/>
    <path d="M9.6 5.2 12 7.6l2.4-2.4"/>
    <path d="M9.6 18.8 12 16.4l2.4 2.4"/>
  </symbol>
  <symbol id="ic-ike" viewBox="0 0 24 24">
    <path d="M3.3 17.4a8.7 8.7 0 1 1 17.4 0"/>
    <path d="M12 17.4 16.6 10.6"/>
    <circle cx="12" cy="17.4" r="1.4"/>
    <path d="M12 8.7V7"/>
    <path d="M5.9 11.2 4.5 10.2"/>
    <path d="M18.1 11.2l1.4-1"/>
  </symbol>
  <symbol id="ic-srs" viewBox="0 0 24 24">
    <circle cx="6.9" cy="6.3" r="2.4"/>
    <path d="M3.4 19.6v-6.1a3 3 0 0 1 3-3h1.7"/>
    <path d="M3.4 19.6h5"/>
    <circle cx="15.6" cy="13.9" r="5.2"/>
  </symbol>
  <symbol id="ic-vtc" viewBox="0 0 24 24">
    <path d="M12 2.7c2.9 0 5.2 2.3 5.2 5.2 0 2-1.1 3.7-2.8 4.6v2.1H9.6v-2.1C7.9 11.6 6.8 9.9 6.8 7.9c0-2.9 2.3-5.2 5.2-5.2z"/>
    <path d="M9.6 16.6h4.8v4.7H9.6z"/>
  </symbol>
  <symbol id="ic-hunt" viewBox="0 0 24 24">
    <circle cx="10.3" cy="10.3" r="6.6"/>
    <path d="M15.2 15.2 20.6 20.6"/>
    <path d="M10.3 7.5v5.6"/>
    <path d="M7.5 10.3h5.6"/>
  </symbol>
  <symbol id="ic-lcm" viewBox="0 0 24 24">
    <path d="M3.6 5.4h4.1a6.6 6.6 0 0 1 0 13.2H3.6z"/>
    <path d="M14.2 8.4h5.3"/>
    <path d="M14.2 12h6.4"/>
    <path d="M14.2 15.6h5.3"/>
  </symbol>
</svg>

<header>
  <div class="titlebar">
    <h1 data-i18n="app.title"></h1>
    <select id="lang" aria-label="Language"></select>
  </div>
  <div class="sub" id="subtitle" data-i18n="app.subtitle"></div>
  <dl class="vitals" id="vitals"></dl>
</header>

<div class="warnbox" id="unsupported" data-i18n="note.unsupported" data-i18n-html hidden></div>

<div class="bar">
  <button id="connect" data-i18n="btn.connect"></button>
  <button id="scan" class="ghost" data-i18n="btn.scan" disabled></button>
  <button id="stop" class="ghost" data-i18n="btn.stop" hidden></button>
  <span class="status" id="status" data-i18n="status.idle"></span>
</div>

<div class="grid" id="grid"></div>

<p class="note" id="ignhint" hidden></p>

<div class="bar" id="exports" hidden>
  <button id="doc" data-i18n="btn.doc"></button>
  <button class="ghost" id="share" data-i18n="btn.share"></button>
  <button class="ghost" id="copy" data-i18n="btn.copy"></button>
  <span class="status" id="savedmsg"></span>
</div>

<section class="panel" id="live" hidden>
  <h2 data-i18n="live.title"></h2>
  <p class="note" style="margin-top:0" data-i18n="live.intro"></p>
  <div id="live-body"></div>
</section>

<section class="panel" id="unknown" hidden>
  <h2 data-i18n="hunt.title"></h2>
  <p class="note" style="margin-top:0" data-i18n="hunt.intro2"></p>
  <div id="unknown-body"></div>
</section>

<details>
  <summary data-i18n="raw.summary"></summary>
  <pre id="trace"></pre>
</details>

<p class="note" data-i18n="note.evidence" data-i18n-html></p>
<p class="note" data-i18n="note.clear" data-i18n-html></p>

<footer class="foot">
  <p class="foot-warn" data-i18n="foot.warn"></p>
  <p class="foot-links">
    <a id="link-src" href="#" target="_blank" rel="noopener" data-i18n="foot.source"></a> ·
    <a id="link-lic" href="#" target="_blank" rel="noopener" data-i18n="foot.licence"></a> ·
    <a id="link-iss" href="#" target="_blank" rel="noopener" data-i18n="foot.issue"></a>
  </p>
  <p class="foot-note" data-i18n="foot.vendor"></p>
</footer>

<dialog id="consent">
  <div class="dlg-head">
    <svg class="ic"><use href="#ic-hunt"/></svg>
    <div><b data-i18n="consent.title"></b><div class="sub" data-i18n="consent.sub"></div></div>
  </div>
  <div class="dlg-body">
    <p class="warn-lead" data-i18n="consent.lead"></p>
    <p class="store" data-i18n="consent.what"></p>
    <ul id="consent-list" class="consent-list"></ul>
    <label class="consent-opt" id="consent-vinrow">
      <input type="checkbox" id="consent-novin" checked>
      <span><b data-i18n="consent.novin"></b><br><span class="sub" data-i18n="consent.vinnote"></span></span>
    </label>
  </div>
  <div class="dlg-foot">
    <button class="ghost" id="consent-no" data-i18n="consent.cancel"></button>
    <button class="ghost" id="consent-yes" data-i18n="consent.ok"></button>
  </div>
</dialog>

<dialog id="detail">
  <div class="dlg-head">
    <svg class="ic"><use id="d-icon" href=""/></svg>
    <div><b id="d-name"></b><div class="sub" id="d-label"></div></div>
  </div>
  <div class="dlg-body" id="d-body"></div>
  <div class="dlg-foot">
    <button class="ghost" id="d-again" data-i18n="btn.again" hidden></button>
    <button class="ghost" id="d-live" data-i18n="btn.live" hidden></button>
    <button class="ghost" id="d-clear" data-i18n="btn.clear" hidden></button>
    <button class="ghost" id="d-close" data-i18n="btn.close"></button>
    <span class="status" id="d-clearmsg"></span>
  </div>
</dialog>

<script type="module" src="js/app.js"></script>
</body>
</html>
